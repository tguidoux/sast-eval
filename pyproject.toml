[project]
name = "sast-eval"
version = "0.1.5"
description = "Unified SAST evaluation harness across OWASP BenchmarkJava, bountytasks, CWE-Bench-Java, CyberGym, and SASTbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sast-eval contributors" }]
keywords = ["sast", "static-analysis", "security", "benchmark", "evaluation", "sarif", "vulnerability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
sast-eval = "sast_eval.cli:main"

[project.urls]
Documentation = "https://github.com/theoguidoux/sast-eval/tree/main/docs"
Source = "https://github.com/theoguidoux/sast-eval"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sast_eval"]

[tool.hatch.build.targets.wheel.force-include]
"sast_eval/matching/cwe_map.json" = "sast_eval/matching/cwe_map.json"

[tool.uv]
package = true
